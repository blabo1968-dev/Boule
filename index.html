<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pétanque Master – Offizielles Regelwerk</title>
    <style>
        body {
            margin: 0;
            padding: 8px;
            background-color: #0b1329;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            overflow-x: hidden;
        }
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #101d3f, #070b19);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .start-container {
            text-align: center;
            border: 2px solid #ffffff;
            border-radius: 12px;
            padding: 25px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 0 30px rgba(0, 85, 164, 0.4);
            background: rgba(11, 19, 41, 0.95);
        }
        h1 {
            font-size: 1.6rem;
            color: #ffffff;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(239, 65, 53, 0.5);
        }
        .subtitle {
            font-size: 0.85rem;
            color: #cfd8dc;
            margin-bottom: 12px;
        }
        .developer {
            font-size: 0.75rem;
            color: #a0aab5;
            margin-bottom: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 0;
        }
        .developer span {
            color: #ef4135;
            font-weight: bold;
        }
        .menu-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
            text-align: left;
        }
        .menu-group label {
            font-size: 0.8rem;
            color: #cfd8dc;
        }
        select, .btn {
            width: 100%;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            border: none;
            box-sizing: border-box;
        }
        select {
            background: #101d3f;
            color: #fff;
            border: 1px solid #0055a4;
        }
        .btn {
            background-color: #0055a4;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-transform: uppercase;
            margin-top: 5px;
        }
        .btn:hover { background-color: #004080; }

        #gameApp {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 360px;
        }
        .game-header {
            text-align: center;
            margin-bottom: 4px;
            width: 100%;
        }
        .game-header h2 {
            margin: 0;
            color: #ffffff;
            font-size: 1.1rem;
            text-shadow: 0 0 8px rgba(0, 85, 164, 0.8);
        }
        .status-bar {
            font-size: 0.75rem;
            color: #ffeb3b;
            margin: 3px 0 6px 0;
            background: rgba(255,255,255,0.08);
            padding: 5px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.15);
            text-align: center;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
        }

        .game-main-layout {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 6px;
            width: 100%;
            margin-bottom: 6px;
        }

        .side-panel {
            width: 65px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 4px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-sizing: border-box;
        }
        .blue-panel { border-color: rgba(77, 166, 255, 0.4); }
        .red-panel { border-color: rgba(255, 102, 102, 0.4); }

        .counter-title {
            font-size: 0.55rem;
            font-weight: bold;
            margin-bottom: 4px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.1;
        }
        .blue-panel .counter-title { color: #4da6ff; }
        .red-panel .counter-title { color: #ff6666; }

        .score-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: center;
            width: 100%;
        }
        .score-item {
            font-size: 0.55rem;
            width: 100%;
            height: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            color: #888;
            background: rgba(0,0,0,0.3);
        }
        .score-item.active {
            color: #fff;
            font-weight: bold;
        }
        .blue-panel .score-item.active { background-color: #0055a4; }
        .red-panel .score-item.active { background-color: #ef4135; }

        #terrain {
            position: relative;
            width: 215px;
            height: 340px;
            background-color: #7b848c;
            background-image: 
                radial-gradient(circle, #5a626a 10%, transparent 11%),
                radial-gradient(circle, #959ea6 10%, transparent 11%);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 85, 164, 0.3);
            overflow: hidden;
            touch-action: none;
            flex-shrink: 0;
        }
        .circle-abwurf {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 36px;
            border: 3px dashed #ef4135;
            border-radius: 50%;
            background: rgba(239, 65, 53, 0.2);
            pointer-events: none;
        }
        .ball {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 2px 3px 5px rgba(0,0,0,0.6);
        }
        .target-ball {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, #ffeb3b, #f57f17);
            width: 10px;
            height: 10px;
            border: 1px solid #333;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 1px 2px 4px rgba(0,0,0,0.6);
            z-index: 10;
        }
        .blue-ball {
            background: radial-gradient(circle at 30% 30%, #4da6ff, #004080);
            border: 1px solid #fff;
        }
        .red-ball {
            background: radial-gradient(circle at 30% 30%, #ff6666, #b30000);
            border: 1px solid #fff;
        }
        #aimMarker {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px dashed #ffeb3b;
            border-radius: 50%;
            background: rgba(255, 235, 59, 0.25);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 8;
            display: none;
        }
        #impactFlash {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #b0b8c0;
            border: 1px solid #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 25;
            display: none;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            box-sizing: border-box;
        }
        .power-slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .power-slider-container label {
            font-size: 0.75rem;
            font-weight: bold;
            color: #cfd8dc;
            white-space: nowrap;
        }
        input[type=range] {
            flex: 1;
            accent-color: #ef4135;
        }
        .btn-wurf {
            background-color: #ef4135;
            color: #fff;
            border: none;
            padding: 9px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
        }
        .btn-wurf:hover { background-color: #d32f2f; }
        .btn-wurf:disabled { background-color: #555; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="startScreen">
        <div class="start-container">
            <h1>Pétanque Master</h1>
            <div class="subtitle">Offizielles Regelwerk (Art. 14)</div>
            
            <div class="developer">
                Entwickelt von <span>Blankenhagen Spieleentwicklung</span>
            </div>

            <div class="menu-group">
                <label for="selectMode">Spielmodus:</label>
                <select id="selectMode">
                    <option value="tete">Tête-à-Tête (1v1, je 3 Kugeln)</option>
                    <option value="doublette" selected>Doublette (2v2, je 3 Kugeln)</option>
                    <option value="triplette">Triplette (3v3, je 2 Kugeln)</option>
                </select>
            </div>

            <div class="menu-group">
                <label for="selectDifficulty">KI-Schwierigkeit:</label>
                <select id="selectDifficulty">
                    <option value="leicht">Leicht (Entspanntes Spiel)</option>
                    <option value="mittel" selected>Mittel (Ausgewogen)</option>
                    <option value="schwer">Herausfordernd</option>
                </select>
            </div>

            <button class="btn" id="startBtn" onclick="startGame()">Spiel starten</button>
        </div>
    </div>

    <div id="gameApp">
        <div class="game-header">
            <h2>Pétanque Master</h2>
            <div class="status-bar" id="statusBar">Bereit zum Start</div>
        </div>

        <div class="game-main-layout">
            <div class="side-panel blue-panel">
                <div class="counter-title">Du (Blau)<br>[Rest: <span id="restBlue">3</span>]</div>
                <div class="score-list" id="counter-blue"></div>
            </div>

            <div id="terrain">
                <div class="circle-abwurf" id="abwurfKreis"></div>
                <div id="aimMarker"></div>
                <div id="impactFlash"></div>
                <div class="target-ball" id="targetBall"></div>
                <div id="ballsContainer"></div>
            </div>

            <div class="side-panel red-panel">
                <div class="counter-title" id="kiTitle">KI (Rot)<br>[Rest: <span id="restRed">3</span>]</div>
                <div class="score-list" id="counter-red"></div>
            </div>
        </div>

        <div class="control-panel">
            <div class="power-slider-container">
                <label for="powerRange" id="powerLabel">Kraft: 70%</label>
                <input type="range" id="powerRange" min="20" max="112" value="78">
            </div>
            <button class="btn-wurf" id="btnWurf" onclick="executePlayerThrow()">Wurf im Bogen ausführen</button>
        </div>
    </div>

    <script>
        let scoreBlue = 0;
        let scoreRed = 0;
        let currentTurn = 'blue';
        let ballsLeftBlue = 3;
        let ballsLeftRed = 3;
        let playedBalls = []; 
        
        let targetBallObj = { x: 107, y: 75, vx: 0, vy: 0, radius: 5, team: 'target', out: false };

        let difficulty = 'mittel';
        let gameMode = 'doublette';
        let isProcessing = false;
        let lastRoundWinner = 'blue';

        let aimX = 107;
        let aimY = 130;

        const terrain = document.getElementById('terrain');
        let audioCtx = null;

        function playMetalClankSound(isHardHit) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                let osc = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();

                osc.type = 'triangle';
                let baseFreq = isHardHit ? 850 : 600;
                osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);

                gainNode.gain.setValueAtTime(isHardHit ? 0.7 : 0.4, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function startGame() {
            gameMode = document.getElementById('selectMode').value;
            difficulty = document.getElementById('selectDifficulty').value;

            if (gameMode === 'tete' || gameMode === 'doublette') {
                ballsLeftBlue = 3;
                ballsLeftRed = 3;
            } else {
                ballsLeftBlue = 2;
                ballsLeftRed = 2;
            }

            scoreBlue = 0;
            scoreRed = 0;
            isProcessing = false;
            lastRoundWinner = 'blue';

            document.getElementById('kiTitle').innerHTML = `KI (${difficulty.toUpperCase()})<br>[Rest: <span id="restRed">${ballsLeftRed}</span>]`;
            
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameApp').style.display = 'flex';

            randomizeTargetPosition();
            initGame();
        }

        const powerRangeInput = document.getElementById('powerRange');
        const powerLabel = document.getElementById('powerLabel');
        powerRangeInput.addEventListener('input', (e) => {
            let val = parseInt(e.target.value);
            let percent = Math.round((val / 112) * 100);
            powerLabel.innerText = `Kraft: ${percent}%`;
            updateAimVisuals(aimX, aimY);
        });

        function randomizeTargetPosition() {
            targetBallObj.x = 50 + Math.random() * 115;
            targetBallObj.y = 60 + Math.random() * 80;
            targetBallObj.vx = 0;
            targetBallObj.vy = 0;
            targetBallObj.out = false;
            updateTargetBallDOM();
        }

        function updateTargetBallDOM() {
            const targetEl = document.getElementById('targetBall');
            if (targetBallObj.out) {
                targetEl.style.display = 'none';
            } else {
                targetEl.style.display = 'block';
                targetEl.style.left = targetBallObj.x + 'px';
                targetEl.style.top = targetBallObj.y + 'px';
            }
        }

        function initGame() {
            updateCounters();
            updateRestDisplay();
            aimX = 107;
            aimY = 130;
            updateAimVisuals(aimX, aimY);
            determineNextTurnByRules();
        }

        function updateCounters() {
            createScoreList('counter-blue', scoreBlue);
            createScoreList('counter-red', scoreRed);
        }

        function createScoreList(containerId, currentScore) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            for (let i = 0; i <= 13; i++) {
                let item = document.createElement('div');
                item.className = 'score-item' + (i === currentScore ? ' active' : '');
                item.innerText = i;
                container.appendChild(item);
            }
        }

        function updateRestDisplay() {
            document.querySelector('.blue-panel .counter-title').innerHTML = `Du (Blau)<br>[Rest: <span>${ballsLeftBlue}</span>]`;
            document.querySelector('.red-panel .counter-title').innerHTML = `KI (${difficulty.toUpperCase()})<br>[Rest: <span>${ballsLeftRed}</span>]`;
        }

        function determineNextTurnByRules() {
            if (isProcessing) return;

            if (targetBallObj.out) {
                isProcessing = true;
                document.getElementById('btnWurf').disabled = true;
                document.getElementById('statusBar').innerText = "Schweinchen im AUS! Regel-Auswertung...";
                setTimeout(handleTargetOutRule, 1500);
                return;
            }

            if (ballsLeftBlue <= 0 && ballsLeftRed <= 0) {
                isProcessing = true;
                document.getElementById('btnWurf').disabled = true;
                document.getElementById('statusBar').innerText = "Aufnahme beendet! Auswertung...";
                setTimeout(endRundeAutomatically, 1200);
                return;
            }

            let activeBalls = playedBalls.filter(b => !b.out);
            if (activeBalls.length === 0) {
                currentTurn = lastRoundWinner;
            } else {
                let closestTeam = getClosestTeamToTarget();
                if (!closestTeam) {
                    currentTurn = lastRoundWinner;
                } else {
                    let opponentTeam = closestTeam === 'blue' ? 'red' : 'blue';
                    let opponentHasBalls = opponentTeam === 'blue' ? (ballsLeftBlue > 0) : (ballsLeftRed > 0);
                    let myTeamHasBalls = closestTeam === 'blue' ? (ballsLeftBlue > 0) : (ballsLeftRed > 0);

                    if (opponentHasBalls && !myTeamHasBalls) {
                        currentTurn = opponentTeam;
                    } else if (!opponentHasBalls && myTeamHasBalls) {
                        currentTurn = closestTeam;
                    } else {
                        currentTurn = opponentTeam;
                    }
                }
            }

            if (currentTurn === 'blue' && ballsLeftBlue <= 0 && ballsLeftRed > 0) currentTurn = 'red';
            if (currentTurn === 'red' && ballsLeftRed <= 0 && ballsLeftBlue > 0) currentTurn = 'blue';

            updateStatus();

            if (currentTurn === 'red') {
                document.getElementById('btnWurf').disabled = true;
                document.getElementById('aimMarker').style.display = 'none';
                setTimeout(computerTurn, 1000);
            } else {
                document.getElementById('btnWurf').disabled = false;
                document.getElementById('aimMarker').style.display = 'block';
            }
        }

        function handleTargetOutRule() {
            let blueHasBalls = ballsLeftBlue > 0;
            let redHasBalls = ballsLeftRed > 0;

            if (blueHasBalls && redHasBalls) {
                document.getElementById('statusBar').innerText = "Schweinchen im Aus & beide haben Kugeln: Aufnahme wird annulliert!";
                setTimeout(() => { resetRundeData(); }, 2500);
            } else if (!blueHasBalls && !redHasBalls) {
                document.getElementById('statusBar').innerText = "Schweinchen im Aus & keine Kugeln übrig: Keine Punkte.";
                setTimeout(() => { resetRundeData(); }, 2500);
            } else {
                let scoringTeam = blueHasBalls ? 'blue' : 'red';
                let remainingBalls = scoringTeam === 'blue' ? ballsLeftBlue : ballsLeftRed;
                let earnedPoints = remainingBalls;

                if (scoringTeam === 'blue') {
                    scoreBlue += earnedPoints;
                    if (scoreBlue > 13) scoreBlue = 13;
                    lastRoundWinner = 'blue';
                    document.getElementById('statusBar').innerText = `Schweinchen im Aus! Du erhältst ${earnedPoints} Punkt(e).`;
                } else {
                    scoreRed += earnedPoints;
                    if (scoreRed > 13) scoreRed = 13;
                    lastRoundWinner = 'red';
                    document.getElementById('statusBar').innerText = `Schweinchen im Aus! KI erhält ${earnedPoints} Punkt(e).`;
                }

                updateCounters();

                setTimeout(() => {
                    if (scoreBlue >= 13 || scoreRed >= 13) {
                        document.getElementById('statusBar').innerText = scoreBlue >= 13 ? "Glückwunsch! Du hast das Match gewonnen!" : "Die KI hat das Match gewonnen!";
                        setTimeout(resetMatch, 3500);
                    } else {
                        resetRundeData();
                    }
                }, 2500);
            }
        }

        function getClosestTeamToTarget() {
            let activeBalls = playedBalls.filter(b => !b.out);
            if (activeBalls.length === 0 || targetBallObj.out) return null;
            let closest = activeBalls[0];
            let minDistance = Math.hypot(closest.x - targetBallObj.x, closest.y - targetBallObj.y);

            for (let i = 1; i < activeBalls.length; i++) {
                let dist = Math.hypot(activeBalls[i].x - targetBallObj.x, activeBalls[i].y - targetBallObj.y);
                if (dist < minDistance) {
                    minDistance = dist;
                    closest = activeBalls[i];
                }
            }
            return closest.team;
        }

        function getDistanceFromTargetInCm(ball) {
            let pixelDist = Math.hypot(ball.x - targetBallObj.x, ball.y - targetBallObj.y);
            return Math.round(pixelDist * 2.5);
        }

        function updateStatus(lastThrownBall = null, teamName = "") {
            let leadingTeam = getClosestTeamToTarget();
            let leadingText = leadingTeam === 'blue' ? 'Du vorne' : (leadingTeam === 'red' ? 'KI vorne' : 'Keine Kugel');

            if (lastThrownBall) {
                if (lastThrownBall.out) {
                    document.getElementById('statusBar').innerText = `Wurf im AUS!`;
                } else {
                    let cm = getDistanceFromTargetInCm(lastThrownBall);
                    let teamLabel = teamName === 'blue' ? 'Dein Wurf' : 'KI-Wurf';
                    document.getElementById('statusBar').innerText = `${teamLabel}: ${cm} cm (${leadingText})`;
                }
            } else {
                if (currentTurn === 'blue') {
                    document.getElementById('statusBar').innerText = `Du am Zug (${leadingText}) | Ziel antippen`;
                } else {
                    document.getElementById('statusBar').innerText = `KI am Zug (${leadingText}) | Überlegt...`;
                }
            }
        }

        terrain.addEventListener('pointerdown', (e) => {
            if (currentTurn !== 'blue' || ballsLeftBlue <= 0 || isProcessing) return;
            const rect = terrain.getBoundingClientRect();
            let clickX = e.clientX - rect.left;
            let clickY = e.clientY - rect.top;

            aimX = clickX;
            aimY = clickY;
            updateAimVisuals(aimX, aimY);
        });

        function updateAimVisuals(targetX, targetY) {
            const startX = 107; 
            const startY = 300;
            let dx = targetX - startX;
            let dy = targetY - startY;
            let dist = Math.hypot(dx, dy) || 1;
            let clampedDist = Math.min(dist, 160);
            
            let impactX = startX + (dx / dist) * clampedDist;
            let impactY = startY + (dy / dist) * clampedDist;

            const marker = document.getElementById('aimMarker');
            marker.style.left = impactX + 'px';
            marker.style.top = impactY + 'px';
        }

        function executePlayerThrow() {
            if (currentTurn !== 'blue' || ballsLeftBlue <= 0 || isProcessing) return;
            isProcessing = true;
            document.getElementById('btnWurf').disabled = true;
            document.getElementById('aimMarker').style.display = 'none';

            let powerVal = parseInt(document.getElementById('powerRange').value);
            const startX = 107;
            const startY = 300;
            
            let dx = aimX - startX;
            let dy = aimY - startY;
            let dist = Math.hypot(dx, dy) || 1;

            let impactX = startX + (dx / dist) * Math.min(dist, 160);
            let impactY = startY + (dy / dist) * Math.min(dist, 160);

            ballsLeftBlue--;
            updateRestDisplay();
            startArcThrowSimulation('blue', startX, startY, impactX, impactY, powerVal);
        }

        function computerThrow() {
            if (ballsLeftRed <= 0 || isProcessing) return;
            isProcessing = true;

            let activeBalls = playedBalls.filter(b => !b.out);
            let closestTeam = getClosestTeamToTarget();
            let shouldShoot = false;
            let targetToShoot = null;

            // DEFENSIVE KI-LOGIK: Schießen NUR wenn taktisch unbedingt erforderlich (z.B. Du liegst extrem nah dran)
            if (closestTeam === 'blue' && difficulty !== 'leicht') {
                let bestBlueBall = activeBalls
                    .filter(b => b.team === 'blue')
                    .reduce((closest, b) => {
                        let dPrev = Math.hypot(closest.x - targetBallObj.x, closest.y - targetBallObj.y);
                        let dCurr = Math.hypot(b.x - targetBallObj.x, b.y - targetBallObj.y);
                        return dCurr < dPrev ? b : closest;
                    }, activeBalls.filter(b => b.team === 'blue')[0]);

                if (bestBlueBall) {
                    let distanceToTarget = Math.hypot(bestBlueBall.x - targetBallObj.x, bestBlueBall.y - targetBallObj.y);
                    // Schießt nur, wenn deine Kugel sehr nah am Schweinchen liegt (< 35 Pixel) und die KI schwerere Stufen hat oder unter Druck ist
                    if (distanceToTarget < 35 && (difficulty === 'schwer' || ballsLeftRed === 1)) {
                        shouldShoot = true;
                        targetToShoot = bestBlueBall;
                    }
                }
            }

            let compX, compY, powerVal;
            // Hauptziel der KI: So nah wie möglich an die Sau legen (Pointieren)
            let scatter = difficulty === 'leicht' ? 30 : (difficulty === 'mittel' ? 15 : 6);

            if (shouldShoot && targetToShoot) {
                compX = targetToShoot.x + (Math.random() - 0.5) * scatter;
                compY = targetToShoot.y + (Math.random() - 0.5) * scatter;
                powerVal = 105; // Harter Schuss
                document.getElementById('statusBar').innerText = `KI schießt taktisch auf deine Kugel!`;
            } else {
                // Konzentration auf das Schweinchen (legen)
                compX = targetBallObj.x + (Math.random() - 0.5) * scatter;
                compY = targetBallObj.y + (Math.random() - 0.5) * scatter;
                powerVal = 74; // Kontrollierter Wurf zum Legen
                document.getElementById('statusBar').innerText = `KI legt eine Kugel nah an die Sau.`;
            }

            const startX = 107;
            const startY = 300;

            ballsLeftRed--;
            updateRestDisplay();
            
            setTimeout(() => {
                startArcThrowSimulation('red', startX, startY, compX, compY, powerVal);
            }, 1000);
        }

        function computerTurn() {
            if (ballsLeftRed <= 0 || isProcessing) return;
            computerThrow();
        }

        function startArcThrowSimulation(team, startX, startY, impactX, impactY, powerVal) {
            let ballObj = { x: startX, y: startY, vx: 0, vy: 0, team: team, radius: 8, out: false };
            playedBalls.push(ballObj);

            let totalFrames = 30;
            let frame = 0;

            function arcStep() {
                frame++;
                let t = frame / totalFrames;

                ballObj.x = startX + (impactX - startX) * t;
                ballObj.y = startY + (impactY - startY) * t;

                let scale = 1 + Math.sin(t * Math.PI) * 0.5;
                redrawBalls();
                
                let container = document.getElementById('ballsContainer');
                let el = container.lastElementChild;
                if (el) {
                    el.style.transform = `translate(-50%, -50%) scale(${scale})`;
                    el.style.zIndex = '20';
                }

                if (frame < totalFrames) {
                    requestAnimationFrame(arcStep);
                } else {
                    const impactFlash = document.getElementById('impactFlash');
                    impactFlash.style.left = impactX + 'px';
                    impactFlash.style.top = impactY + 'px';
                    impactFlash.style.display = 'block';

                    setTimeout(() => {
                        impactFlash.style.display = 'none';
                    }, 800);

                    let rollDx = impactX - startX;
                    let rollDy = impactY - startY;
                    let rollDist = Math.hypot(rollDx, rollDy) || 1;

                    let initialRollSpeed = (powerVal / 25);
                    ballObj.vx = (rollDx / rollDist) * initialRollSpeed;
                    ballObj.vy = (rollDy / rollDist) * initialRollSpeed;

                    playMetalClankSound(powerVal > 90);
                    requestAnimationFrame(groundRollStep);
                }
            }

            function groundRollStep() {
                let allObjects = [...playedBalls.filter(b => !b.out)];
                if (!targetBallObj.out) {
                    allObjects.push(targetBallObj);
                }

                allObjects.forEach(obj => {
                    obj.x += obj.vx;
                    obj.y += obj.vy;
                    obj.vx *= 0.955;
                    obj.vy *= 0.955;

                    if (obj.x < -10 || obj.x > 225 || obj.y < -10 || obj.y > 350) {
                        obj.out = true;
                        obj.vx = 0;
                        obj.vy = 0;
                    }
                });

                let hitOccurred = false;
                for (let i = 0; i < allObjects.length; i++) {
                    for (let j = i + 1; j < allObjects.length; j++) {
                        let b1 = allObjects[i];
                        let b2 = allObjects[j];
                        if (b1.out || b2.out) continue;

                        let distX = b2.x - b1.x;
                        let distY = b2.y - b1.y;
                        let distance = Math.hypot(distX, distY);
                        let minDist = b1.radius + b2.radius;

                        if (distance < minDist) {
                            let overlap = minDist - distance;
                            let nx = distX / (distance || 1);
                            let ny = distY / (distance || 1);

                            b1.x -= nx * overlap * 0.5;
                            b1.y -= ny * overlap * 0.5;
                            b2.x += nx * overlap * 0.5;
                            b2.y += ny * overlap * 0.5;

                            let kx = b1.vx - b2.vx;
                            let ky = b1.vy - b2.vy;
                            let p = 2 * (nx * kx + ny * ky) / 2;

                            b1.vx -= p * nx * 0.9;
                            b1.vy -= p * ny * 0.9;
                            b2.vx += p * nx * 0.9;
                            b2.vy += p * ny * 0.9;

                            hitOccurred = true;
                        }
                    }
                }

                if (hitOccurred) {
                    playMetalClankSound(false);
                }

                redrawBalls();
                updateTargetBallDOM();

                let activeObjects = allObjects.filter(o => !o.out);
                let maxSpeed = activeObjects.length > 0 ? Math.max(...activeObjects.map(o => Math.hypot(o.vx, o.vy))) : 0;

                if (maxSpeed > 0.08) {
                    requestAnimationFrame(groundRollStep);
                } else {
                    activeObjects.forEach(o => { o.vx = 0; o.vy = 0; });
                    updateStatus(ballObj, team);
                    setTimeout(() => {
                        isProcessing = false;
                        determineNextTurnByRules();
                    }, 600);
                }
            }

            requestAnimationFrame(arcStep);
        }

        function redrawBalls() {
            const container = document.getElementById('ballsContainer');
            container.innerHTML = '';

            playedBalls.forEach(b => {
                if (!b.out) {
                    let el = document.createElement('div');
                    el.className = `ball ${b.team === 'blue' ? 'blue-ball' : 'red-ball'}`;
                    el.style.left = b.x + 'px';
                    el.style.top = b.y + 'px';
                    container.appendChild(el);
                }
            });
        }

        function endRundeAutomatically() {
            let closestTeam = getClosestTeamToTarget();
            let earnedPoints = 0;

            if (closestTeam) {
                let opponentTeam = closestTeam === 'blue' ? 'red' : 'blue';
                let bestOpponentDist = 9999;
                
                playedBalls.forEach(b => {
                    if (!b.out && b.team === opponentTeam) {
                        let d = Math.hypot(b.x - targetBallObj.x, b.y - targetBallObj.y);
                        if (d < bestOpponentDist) bestOpponentDist = d;
                    }
                });

                playedBalls.forEach(b => {
                    if (!b.out && b.team === closestTeam) {
                        let d = Math.hypot(b.x - targetBallObj.x, b.y - targetBallObj.y);
                        if (d < bestOpponentDist) {
                            earnedPoints++;
                        }
                    }
                });

                if (earnedPoints === 0) earnedPoints = 1;

                if (closestTeam === 'blue') {
                    scoreBlue += earnedPoints;
                    if (scoreBlue > 13) scoreBlue = 13;
                    lastRoundWinner = 'blue';
                    document.getElementById('statusBar').innerText = `Aufnahme beendet: Du gewinnst ${earnedPoints} Punkt(e)!`;
                } else {
                    scoreRed += earnedPoints;
                    if (scoreRed > 13) scoreRed = 13;
                    lastRoundWinner = 'red';
                    document.getElementById('statusBar').innerText = `Aufnahme beendet: KI gewinnt ${earnedPoints} Punkt(e)!`;
                }
            }

            updateCounters();

            setTimeout(() => {
                if (scoreBlue >= 13 || scoreRed >= 13) {
                    document.getElementById('statusBar').innerText = scoreBlue >= 13 ? "Glückwunsch! Du hast das Match gewonnen!" : "Die KI hat das Match gewonnen!";
                    setTimeout(resetMatch, 3500);
                } else {
                    resetRundeData();
                }
            }, 3000);
        }

        function resetRundeData() {
            playedBalls = [];
            if (gameMode === 'tete' || gameMode === 'doublette') {
                ballsLeftBlue = 3;
                ballsLeftRed = 3;
            } else {
                ballsLeftBlue = 2;
                ballsLeftRed = 2;
            }
            randomizeTargetPosition();
            isProcessing = false;
            initGame();
        }

        function resetMatch() {
            scoreBlue = 0;
            scoreRed = 0;
            document.getElementById('gameApp').style.display = 'none';
            document.getElementById('startScreen').style.display = 'flex';
        }
    </script>
</body>
