<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Handy Boule Spiel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            text-align: center;
        }
        #game-container {
            width: 100%;
            max-width: 400px;
            background-color: #1c2541;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        canvas {
            width: 100%;
            height: auto;
            aspect-ratio: 3 / 4;
            background-color: #273b5e;
            border-radius: 8px;
            display: block;
        }
        .control-panel {
            background-color: #3a506b;
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .kraft-label {
            font-size: 0.9rem;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            height: 25px;
            accent-color: #e63946;
        }
        button {
            width: 100%;
            background-color: #e63946;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:active {
            background-color: #d90429;
        }
    </style>
</head>
<body>

    <h1>Boule Spiel</h1>
    
    <div id="game-container">
        <!-- Spielfläche / Canvas -->
        <canvas id="bouleCanvas" width="300" height="400"></canvas>
        
        <!-- Steuerungsbereich (kompakt für Smartphones) -->
        <div class="control-panel">
            <div class="kraft-label" id="kraftText">Kraft: 50%</div>
            <input type="range" id="kraftRegler" min="1" max="100" value="50">
            <button id="wurfBtn">Wurf im Bogen ausführen</button>
        </div>
    </div>

    <script>
        // Einfache Logik für den Regler-Text zur Veranschaulichung
        const regler = document.getElementById('kraftRegler');
        const kraftText = document.getElementById('kraftText');

        regler.addEventListener('input', (e) => {
            kraftText.innerText = `Kraft: ${e.target.value}%`;
        });
    </script>

</body>
</html>
